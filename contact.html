<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên hệ</title>
    <style>
/* Thanh điều hướng */
.navbar {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;

    padding: 12px 18px;
    background: rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 16px;

    z-index: 1000;
}

/* Các nút trong menu */
.navbar a {
    color: white;
    text-decoration: none;
    font-size: 16px;
    font-weight: 600;

    padding: 10px 20px;
    border-radius: 10px;

    transition: all 0.3s ease;
    white-space: nowrap;
}

/* Hiệu ứng khi rê chuột */
.navbar a:hover {
    background: white;
    color: #667eea;
    transform: translateY(-2px);
}

/* Trang đang được chọn */
.navbar a.active {
    background: white;
    color: #667eea;
}

/* Tránh menu che nội dung */
body {
    padding-top: 100px;
}

/* Tương thích điện thoại */
@media (max-width: 600px) {
    .navbar {
        top: 10px;
        gap: 4px;
        padding: 8px;
        width: max-content;
        max-width: calc(100% - 20px);
    }

    .navbar a {
        font-size: 13px;
        padding: 10px 12px;
    }
}

    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html">Trang chủ</a>
        <a href="about.html" >Giới thiệu</a>
        <a href="contact.html" class="active" >Liên hệ</a>
    </nav>

    <h1>Thông tin liên hệ</h1>
    <p>Email: example@gmail.com</p>
</body>
</html>
